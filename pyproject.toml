[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-lifecycle-monitor"
version = "0.1.0"
description = "Demonstrable ML lifecycle, serving, and monitoring project"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3",
  "scikit-learn>=1.4,<2", "pandas>=2.1,<3", "numpy>=1.26,<3",
  "mlflow>=2.12,<4", "streamlit>=1.33,<2", "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["mlops_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
